[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ord-service"
version = "0.1.0"
description = "FastAPI service for exploring the Open Reaction Database"
authors = [{name = "ORD Platform Team", email = "opensource@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.112",
    "pydantic>=2.7,<3.0",
    "uvicorn[standard]>=0.30,<0.31",
    "fakeredis>=2.23,<3.0"
]

[project.optional-dependencies]
dev = [
    "black>=24.4,<25.0",
    "httpx>=0.27,<0.28",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
]
ignore = ["E501"]
